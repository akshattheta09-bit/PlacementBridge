services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: placementbridge
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: placementbridge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - placementbridge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placementbridge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  placementbridge_data:
